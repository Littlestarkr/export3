# 바깥 링크 주간 점검
# 매주 월요일 오전 9시(한국 시간)에 모든 페이지(*.html)의 바깥 링크를 열어 보고,
# 깨졌거나 확인이 필요한 링크가 있으면 '링크 점검' 이슈 하나에 목록을 덮어쓴다(새 이슈를 계속 만들지 않는다).
# 모두 정상이면 그 이슈를 닫는다. Actions 탭 > 'Weekly link check' > 'Run workflow'로 바로 돌릴 수도 있다.
# 사이트 배포(pages.yml)와는 따로 돌며, 결과와 상관없이 배포에는 영향이 없다.
name: Weekly link check

on:
  schedule:
    - cron: '0 0 * * 1'   # 월요일 00:00 UTC = 09:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/link-check-ok.txt', '.github/scripts/check_links.py']   # 확인 목록·점검기를 고치면 바로 다시 점검

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 링크 점검
        id: check
        run: python3 .github/scripts/check_links.py .

      - name: 결과를 이슈로 남기기
        env:
          GH_TOKEN: ${{ github.token }}
          BROKEN: ${{ steps.check.outputs.broken }}
          UNSURE: ${{ steps.check.outputs.unsure }}
        run: |
          set -euo pipefail
          LABEL="링크 점검"
          gh label create "$LABEL" --color D4A853 --description "주간 바깥 링크 점검 결과" 2>/dev/null || true
          NUM=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          BODY="$(cat link-report.md)

          _점검 시각: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') (한국 시간) · [실행 기록](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          if [ "$BROKEN" = "1" ] || [ "$UNSURE" = "1" ]; then
            TITLE="링크 점검: $(head -1 link-report.md | grep -o '깨진 링크 [0-9]*개, 확인 필요 [0-9]*개')"
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --title "$TITLE" --body "$BODY"
            else
              gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
            fi
          elif [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "모든 바깥 링크가 정상입니다. 이슈를 닫습니다."
            gh issue close "$NUM"
          fi
